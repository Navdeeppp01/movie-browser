<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Browser App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎬 Movie Browser</h1>

    </div>
    <div id="movieResults" class="movie-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
